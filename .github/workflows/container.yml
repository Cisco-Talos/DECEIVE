name: Container and wheel

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen --all-extras
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: deceive:ci
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Test standard image
        run: uv run --frozen --all-extras python scripts/container_smoke.py deceive:ci --report container-arm64.json
      - name: Verify source-only rebuild with warm caches
        run: uv run --frozen --all-extras python scripts/verify_image_rebuild.py deceive:ci --report container-rebuild-arm64.json
      - name: Test active assessment Docker lifecycle
        run: uv run --frozen --all-extras python scripts/assessment_smoke.py deceive:ci
      - name: Test managed deployment CLI
        run: uv run --frozen --all-extras python scripts/managed_smoke.py deceive:ci --report managed-arm64.json
      - run: docker save deceive:ci -o deceive-arm64.tar
      - uses: actions/upload-artifact@v4
        with:
          name: container-arm64
          path: |
            deceive-arm64.tar
            container-arm64.json
            container-rebuild-arm64.json
            managed-arm64.json
  wheel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv build --wheel
      - run: uv run --no-project python scripts/verify_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: |
            dist/*.whl
            wheel-measurements.json
