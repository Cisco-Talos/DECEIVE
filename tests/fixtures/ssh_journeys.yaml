journeys:
- profile: sudo-2019-14287
  username: guest
  prompt: 'guest@build-node-03:~$ '
  banner_contains:
  - Debian GNU/Linux 10 (buster)
  - Authorized access only.
  steps:
  - send: "pwd\r"
    contains:
    - /home/guest
  - send: "ls -la\r"
    contains:
    - .bashrc
    - README.txt
    - builds
    excludes:
    - command not found
  - send: "cat /etc/os-release\r"
    contains:
    - VERSION_ID=10
    - ID=debian
  - send: "ls /bin\r"
    contains:
    - bash
    - ls
  - send: "ls /usr/bin\r"
    contains:
    - python
    - sudo
  - send: "python --version\r"
    contains:
    - Python 3.7.3
  - send: "python -c 'print(1 + 2)'\r"
    contains:
    - '3'
  - send: "sudo -l\r"
    contains:
    - '(ALL, !root) NOPASSWD: /usr/bin/id'
  - send: "sudo -u#-1 id\r"
    contains:
    - uid=0(root)
  - send: "id\r"
    contains:
    - uid=1000(guest)
