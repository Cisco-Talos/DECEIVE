{
  "schema_version": 2,
  "id": "linux-device",
  "version": "1",
  "protocol": "ssh",
  "description": "Bounded whole-device Ubuntu 22.04.5 LTS session with private virtual state.",
  "requirements": {
    "protocol": "ssh",
    "preferred_port": 8022,
    "capabilities": [
      "ssh.commands",
      "ssh.device",
      "ssh.fullscreen"
    ]
  },
  "device": {
    "platform": "linux",
    "interpreter": "bash",
    "model_effects": true,
    "applications": [
      "less",
      "top",
      "vi",
      "device-menu"
    ]
  },
  "identity": {
    "hostname": "build-node-03",
    "os": "Ubuntu 22.04.5 LTS",
    "kernel": "5.15.0-130-generic",
    "architecture": "x86_64",
    "username": "guest",
    "uid": 1000,
    "ssh_version": "OpenSSH_9.3",
    "banner": "Ubuntu 22.04.5 LTS\nAuthorized access only."
  },
  "files": {
    "/etc/hostname": "build-node-03\n",
    "/home/guest/README.txt": "Device workspace\nUse help to discover commands.\n",
    "/home/guest/notes.txt": "alpha\nbeta\ngamma\n",
    "/etc/passwd": "guest:x:1000:1000:Guest:/home/guest:/bin/bash\n"
  },
  "behaviors": [
    {
      "id": "files",
      "kind": "virtual_files",
      "options": {
        "directories": [
          "/tmp",
          "/var/tmp",
          "/home/guest"
        ]
      }
    },
    {
      "id": "identity",
      "kind": "identity"
    }
  ],
  "fallback": "llm_if_available",
  "fallback_reply": {
    "stderr": "bash: command not found\n",
    "exit_status": 127
  },
  "ssh_response_format": "json",
  "prompt": "Simulate only the selected platform and current interaction. Authoritative device facts and private state take precedence. Propose virtual effects explicitly; never invent lasting effects absent from state.",
  "references": [
    "https://www.gnu.org/software/bash/manual/html_node/Shell-Syntax.html"
  ],
  "limitations": [
    "Bounded interpreter and application subsets; no real programs execute.",
    "Reference contents and naming are fictional design fixtures.",
    "Real-model realism requires credentialed online assessment; offline tests do not qualify it."
  ]
}
