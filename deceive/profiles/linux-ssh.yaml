schema_version: 1
id: linux-ssh
version: "3"
description: A Linux build host with stable identity, virtual baseline files and LLM fallback.
protocol: ssh
requirements:
  protocol: ssh
  preferred_port: 8022
  capabilities: [ssh.commands, ssh.structured_responses, 'behavior:identity', 'behavior:virtual_files']
identity:
  hostname: build-node-03
  os: Ubuntu 22.04.5 LTS
  kernel: 5.15.0-130-generic
  architecture: x86_64
  username: guest
  uid: 1000
  ssh_version: OpenSSH_8.9p1 Ubuntu-3ubuntu0.10
  banner: Welcome to the build server.
files:
  /etc/hostname: "build-node-03\n"
  /etc/os-release: "NAME=Ubuntu\nVERSION=22.04.5\nID=ubuntu\nPRETTY_NAME=\"Ubuntu 22.04.5 LTS\"\n"
  /etc/passwd: "root:x:0:0:root:/root:/bin/bash\nguest:x:1000:1000:Build Guest:/home/guest:/bin/bash\n"
  /home/guest/README.txt: "Build artifacts are available through the portal.\n"
behaviors:
  - id: virtual-files
    kind: virtual_files
    options:
      directories: [/tmp, /var/tmp]
  - id: identity
    kind: identity
fallback: llm
ssh_response_format: json
prompt: |
  Emulate a Linux build server belonging to a small software company. Use the
  supplied identity and virtual files consistently. Other activity is isolated to
  this session. Answer only the current command and never invent a following
  command. Use the runtime-requested response format and preserve output bytes,
  including trailing newlines. The server renders the shell prompt and banner.
  The supplied file/directory view is authoritative, including sizes derived from
  UTF-8 file bytes. Do not invent extra files in listings. Unsupported mutations
  must not claim lasting effects absent from this view. Simple literal file
  commands are handled by the runtime; shell expansions and full grammar are not
  implemented. Answer unsupported forms conservatively rather than inventing effects.
limitations:
  - Declared identity and basic virtual-file commands are deterministic; unsupported command forms use generative fallback.
  - Other command output is generative; no command executes on a real system.
  - Simple cat/ls/cd/touch/mkdir/rm and literal echo redirection use bounded private virtual files; full shell grammar, permissions and file timestamps are not emulated.
