schema_version: 1
id: sudo-2019-14287
version: "1"
description: Defined CLI interactions for the sudo special-UID policy bypass.
protocol: ssh
requirements:
  protocol: ssh
  preferred_port: 8022
  capabilities: [ssh.commands, 'behavior:sudo-2019-14287']
identity:
  hostname: build-node-03
  os: Debian GNU/Linux 10
  kernel: 4.19.0-5-amd64
  ssh_version: OpenSSH_7.9p1 Debian-10
  username: guest
  uid: 1000
  banner: Welcome to the build server.
files:
  /etc/hostname: "build-node-03\n"
  /etc/os-release: "NAME=\"Debian GNU/Linux\"\nVERSION_ID=10\nID=debian\n"
  /etc/passwd: "root:x:0:0:root:/root:/bin/bash\nguest:x:1000:1000:Build Guest:/home/guest:/bin/bash\n"
  /etc/sudoers.d/guest: "guest ALL=(ALL, !root) NOPASSWD: /usr/bin/id\n"
behaviors:
  - id: sudo-policy
    kind: sudo-2019-14287
    options: {patched: false, runas_all: true}
  - id: identity
    kind: identity
fallback_reply: {body: "sh: command not found\n", exit_status: 127}
references:
  - https://seclists.org/oss-sec/2019/q4/18
  - https://www.sudo.ws/alerts/minus_1_uid.html
limitations:
  - Only sudo version/list probes and the declared id command family are emulated.
  - Group fields are simulation fixtures; only the documented effective-UID bypass is claimed.
  - No shell execution, persistent root shell, PAM behavior, or arbitrary binaries.
