- id: patched-package
  username: deploy
  password: 
  steps:
  - expect:
      authenticated: false
  overrides:
    ssh_auth:
      kind: musl-star-bypass
      accounts:
        root:
          shadow: '*'
          uid: 0
          shell: /bin/ash
          password: null
        admin:
          shadow: $6$
          uid: 1000
          shell: /bin/ash
          password: fixture-admin-secret
        deploy:
          shadow: '*'
          uid: 1001
          shell: /bin/ash
          password: null
        backup:
          shadow: '*'
          uid: 1002
          shell: /bin/ash
          password: null
        daemon:
          shadow: '*'
          uid: 2
          shell: /sbin/nologin
          password: null
      password_authentication: true
      use_pam: false
      patched: true
      permit_root_login: prohibit-password
