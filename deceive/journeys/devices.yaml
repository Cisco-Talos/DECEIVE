    prompt: 'guest@build-node-03:/tmp$ '
  - command: exit
    contains: []
    prompt: 'guest@build-node-03:/tmp$ '
  - command: echo $TEAM
    contains:
    - inner
    prompt: 'guest@build-node-03:/tmp$ '
  - command: exit
    contains: []
  - command: pwd
    contains:
    - /home/guest
  - command: echo $TEAM
    contains:
    - outer
  - command: cat /tmp/nested
    contains:
    - shared
  - command: false || echo recovered
    contains:
    - recovered
  - command: true && echo ready
