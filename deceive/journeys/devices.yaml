schema_version: 1
journeys:
- id: sudo-device-exploration
  profile: sudo-2019-14287
  prompt: 'guest@build-node-03:~$ '
  steps:
  - {command: pwd, contains: [/home/guest]}
  - {command: hostname, contains: [build-node-03]}
  - {command: whoami, contains: [guest]}
  - {command: id, contains: ['uid=1000(guest)']}
  - {command: uname -s, contains: [Linux]}
  - {command: uname -r, contains: [4.19.0-5-amd64]}
  - {command: ls, contains: [README.txt]}
  - {command: ls -la, contains: [.bashrc, builds]}
  - {command: ls /bin, contains: [bash, cat, ls]}
  - {command: ls /usr/bin, contains: [id, python, sudo]}
  - {command: which python, contains: [/usr/bin/python]}
  - {command: python --version, contains: [Python 3.7.3]}
  - {command: "python -c 'print(1 + 2)'", contains: ['3']}
  - {command: cat /etc/hostname, contains: [build-node-03]}
  - {command: cat /etc/passwd, contains: ['guest:x:1000']}
  - {command: sudo -V, contains: [Sudo version 1.8.27]}
  - {command: sudo -l, contains: ['(ALL, !root) NOPASSWD: /usr/bin/id']}
  - {command: sudo -u#-1 id, contains: ['uid=0(root)']}
  - {command: id -u, contains: ['1000']}
  - {command: echo private > /tmp/note, contains: []}
  - {command: cat /tmp/note, contains: [private]}
  - {command: rm /tmp/note, contains: []}
  - {command: cat /tmp/note, contains: [No such file]}
- id: linux-device-exploration
  profile: linux-device
  prompt: 'guest@build-node-03:~$ '
  steps:
  - command: uname -s
    contains:
    - Linux
  - command: hostname
    contains:
    - build-node-03
  - command: whoami
    contains:
    - guest
  - command: id -u
    contains:
    - '1000'
  - command: pwd
    contains:
    - /home/guest
  - command: ls
    contains:
    - README.txt
  - command: cat README.txt
    contains:
    - Device workspace
  - command: uname -r
    contains:
    - 5.15.0
  - command: uname -m
    contains:
    - x86_64
  - command: cat notes.txt
    contains:
    - alpha
    - gamma
  - command: head -n 1 notes.txt
    contains:
    - alpha
  - command: tail -n 1 notes.txt
    contains:
    - gamma
  - command: cat notes.txt | grep beta
    contains:
    - beta
  - command: cat notes.txt | wc -l
    contains:
    - '3'
  - command: which cat
    contains:
    - /usr/bin/cat
  - command: env
    contains:
    - HOME=/home/guest
  - command: ps
    contains:
    - worker
  - command: cat missing
    contains:
    - No such file
  - command: 'false'
    contains: []
  - command: echo $?
    contains:
    - '1'
  - command: help
    contains:
    - Virtual commands
- id: linux-device-private
  profile: linux-device
  prompt: 'guest@build-node-03:~$ '
  steps:
  - command: echo private > /tmp/journey
    contains: []
  - command: cat /tmp/journey
    contains:
    - private
  - command: wc -c /tmp/journey
    contains:
    - '8'
  - command: cp /tmp/journey /tmp/copy
    contains: []
  - command: cat /tmp/copy
    contains:
    - private
  - command: echo extra >> /tmp/copy
    contains: []
  - command: tail -n 1 /tmp/copy
    contains:
    - extra
  - command: mv /tmp/copy /tmp/moved
    contains: []
  - command: cat /tmp/copy
    contains:
    - No such file
  - command: cat /tmp/moved
    contains:
    - private
    - extra
  - command: chmod 000 /tmp/moved
    contains: []
  - command: cat /tmp/moved
    contains:
    - Permission denied
  - command: chmod 644 /tmp/moved
    contains: []
  - command: stat /tmp/moved
    contains:
    - 'Mode: 644'
  - command: rm /tmp/moved
    contains: []
  - command: cat /tmp/moved
    contains:
    - No such file
  - command: hostname private-device
    contains: []
    prompt: 'guest@private-device:~$ '
  - command: hostname
    contains:
    - private-device
    prompt: 'guest@private-device:~$ '
  - command: cat /etc/hostname
    contains:
    - private-device
    prompt: 'guest@private-device:~$ '
  - command: hostname build-node-03
    contains: []
  - command: hostname
    contains:
    - build-node-03
  - command: rm /tmp/journey
    contains: []
