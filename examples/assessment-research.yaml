  research:
    schema_version: 1
    profile_id: workbench
    version: '1'
    subject: Fictional application and bounded platform/protocol plausibility
    kind: fictional
    sources:
    - id: authored-design
      kind: design
      title: workbench-http-linux
      url: null
      retrieved: '2026-11-04'
      revision: null
      facts:
      - Profile-defined identities, application paths and payloads are authored requirements,
        not external realism evidence.
      limitations: []
    - id: http-semantics
      kind: standard
      title: HTTP Semantics, RFC 9110
      url: https://www.rfc-editor.org/rfc/rfc9110.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - HEAD carries no response content; representation metadata must remain meaningful.
        Status, method and media type have distinct semantics.
      limitations: []
    - id: http2
      kind: standard
      title: HTTP/2, RFC 9113
      url: https://www.rfc-editor.org/rfc/rfc9113.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - HTTP semantics survive multiplexed streams; stream completion and forbidden
        connection-specific fields matter.
      limitations: []
    - id: http3
      kind: standard
      title: HTTP/3, RFC 9114
      url: https://www.rfc-editor.org/rfc/rfc9114.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - HTTP semantics run on QUIC streams; response completion and advertised discovery
        must agree with the endpoint.
      limitations: []
    - id: cookies
      kind: standard
      title: HTTP State Management, RFC 6265
      url: https://www.rfc-editor.org/rfc/rfc6265.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - Separate Set-Cookie fields establish scoped client cookies; user agents maintain
        their own cookie stores.
      limitations: []
    - id: linux-printf
      kind: vendor
      title: GNU printf manual packaged by Ubuntu Jammy
      url: https://manpages.ubuntu.com/manpages/jammy/en/man1/printf.1.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - The format controls output, including escapes and absence of a trailing newline.
      limitations:
      - Shell builtins can differ from the external utility; compare only the declared
        literal subset.
    - id: linux-ls
      kind: vendor
      title: GNU ls manual packaged by Ubuntu Jammy
      url: https://manpages.ubuntu.com/manpages/jammy/en/man1/ls.1.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - ls lists selected file/directory entries; default sorting and hidden-entry
        rules depend on options.
      limitations: []
    - id: linux-id
      kind: vendor
      title: GNU id manual packaged by Ubuntu Jammy
      url: https://manpages.ubuntu.com/manpages/jammy/en/man1/id.1.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - id reports user/group identity; -u selects effective numeric UID, -n selects
        its name.
      limitations:
      - GNU options are broader than the approved sudo command subset.
    - id: os-release
      kind: vendor
      title: Operating system identification specification
      url: https://www.freedesktop.org/software/systemd/man/latest/os-release.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - OS facts use shell-compatible UTF-8 assignments, with consistent ID, VERSION_ID
        and display identity.
      limitations:
      - Current format documentation; distribution-specific contents need separate
        evidence.
    criteria:
    - id: http-fidelity
      roles:
      - protocol
      - product
      - attacker
      - consistency
      sources:
      - http-semantics
      - http2
      - http3
      expectation: Representation bytes, headers, errors and completion remain credible
        across claimed HTTP versions.
      comparisons:
      - Compare GET/HEAD on a representative resource, a negative request, media type
        and length; substantive workflow on each advertised version.
      limitations: []
    - id: private-client-state
      roles:
      - protocol
      - product
      - attacker
      - consistency
      sources:
      - cookies
      expectation: Independent clients have separate cookie stores and claimed private
        application state.
      comparisons:
      - Create a unique marker in one cookie client and read it; use an untouched
        independent recipient; repeat after reconnect.
      limitations:
      - Application lifetime is an authored design choice; cookie standards do not
        require private files.
