    - id: http-fidelity
      roles:
      - protocol
      - product
      - attacker
      - consistency
      sources:
      - http-semantics
      - http2
      - http3
      expectation: Representation bytes, headers, errors and completion remain credible
        across claimed HTTP versions.
      comparisons:
      - Compare GET/HEAD on a representative resource, a negative request, media type
        and length; substantive workflow on each advertised version.
      limitations: []
    - id: private-client-state
      roles:
      - protocol
      - product
      - attacker
      - consistency
      sources:
      - cookies
      expectation: Independent clients have separate cookie stores and claimed private
        application state.
      comparisons:
      - Create a unique marker in one cookie client and read it; use an untouched
        independent recipient; repeat after reconnect.
      limitations:
      - Application lifetime is an authored design choice; cookie standards do not
        require private files.
    - id: linux-command-fidelity
      roles:
      - protocol
      - product
      - attacker
      - consistency
      sources:
      - linux-id
      - linux-printf
      - linux-ls
      expectation: Declared Linux commands have coherent identity, text streams and
        file observations.
      comparisons:
      - Use independent markers, quoted ASCII printf with and without newline where
        generative output is claimed; follow file writes with reads/listings, missing
        reads and independent process checks.
      limitations:
      - printf is generative only on linux-ssh; Workbench has no printf capability
        claim. Full shell grammar, timestamps and exact permissions are excluded.
    - id: scope-coherence
      roles:
      - protocol
      - product
      - attacker
      - consistency
      sources:
      - authored-design
      - http-semantics
      - http2
      - http3
      - cookies
      - linux-printf
      - linux-ls
      - linux-id
      - os-release
      expectation: Representative supported and nearby challenge interactions maintain
        the researched platform/protocol conventions and consistent authored identity.
      comparisons:
      - Choose variations beyond the supplied examples; distinguish an impossible
        in-scope result from a documented exclusion; identify material unknowns instead
        of awarding maximum by default.
      limitations:
      - Authored application status and custom workbench command output establish
        functional conformance only.
    unknowns:
    - No complete real-system equivalence claim. Material unsampled facets must remain
      unassessed.
    - Research does not independently verify every distribution patch/build identity
      or every configuration.
    search_notes:
    - Primary protocol/platform sources read as documentation; no live vulnerable
      reference software, downloaded PoCs or scanners executed.
    - No genuine counterpart packet/session captures collected; documented behavior
      and bounded plausibility are the available comparison basis.
    - No CVE/affected-product exploit claim for this profile; CVE-specific PoCs/detectors
      are not applicable.
    - GNU/OpenGroup direct retrieval failed; Ubuntu-packaged GNU manuals were retrieved
      instead.
