      title: GNU printf manual packaged by Ubuntu Jammy
      url: https://manpages.ubuntu.com/manpages/jammy/en/man1/printf.1.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - The format controls output, including escapes and absence of a trailing newline.
      limitations:
      - Shell builtins can differ from the external utility; compare only the declared
        literal subset.
    - id: linux-ls
      kind: vendor
      title: GNU ls manual packaged by Ubuntu Jammy
      url: https://manpages.ubuntu.com/manpages/jammy/en/man1/ls.1.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - ls lists selected file/directory entries; default sorting and hidden-entry
        rules depend on options.
      limitations: []
    - id: linux-id
      kind: vendor
      title: GNU id manual packaged by Ubuntu Jammy
      url: https://manpages.ubuntu.com/manpages/jammy/en/man1/id.1.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - id reports user/group identity; -u selects effective numeric UID, -n selects
        its name.
      limitations:
      - GNU options are broader than the approved sudo command subset.
    - id: os-release
      kind: vendor
      title: Operating system identification specification
      url: https://www.freedesktop.org/software/systemd/man/latest/os-release.html
      retrieved: '2026-11-04'
      revision: null
      facts:
      - OS facts use shell-compatible UTF-8 assignments, with consistent ID, VERSION_ID
        and display identity.
      limitations:
      - Current format documentation; distribution-specific contents need separate
        evidence.
