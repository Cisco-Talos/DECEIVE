    description: Repeat status through independent clients; compare fixed hostname
      facts.
    steps:
    - select: *id001
      expect:
      - field: body_json.hostname
        capture: hostname
    - select: *id001
      expect:
      - field: body_json.hostname
        equals_capture: hostname
    different_sessions: true
  - id: attacker-state
    role: attacker
    criterion: followup_effects
    kind: state
    description: In one cookie client/version, write a unique marker to a unique /tmp
      file, then read it back.
    steps:
    - select: &id004
      - *id002
      - *id003
      - field: request_json.command
        pattern: ^echo ([a-zA-Z0-9_-]+) > /tmp/[a-zA-Z0-9_.-]+$
        capture: marker
      - field: request_json.command
        pattern: '> (/tmp/[a-zA-Z0-9_.-]+)$'
        capture: path
      expect:
      - field: body_json.exit_status
        equals: 0
    - select: &id005
      - *id002
      - *id003
      - field: request_json.command
        pattern: ^cat (/tmp/[a-zA-Z0-9_.-]+)$
        equals_capture: path
      expect:
      - field: body_json.exit_status
        equals: 0
      - field: body_json.stdout
        pattern: ^(.*)\n$
        equals_capture: marker
    same_session: true
  - id: consistency-baseline
    role: consistency
    criterion: baseline_identity
    kind: baseline
    description: Check status and landing identity on every advertised version.
