# Frozen coverage and private controls. Give reviewers only public begin-loop JSON and the baseline document.
schema_version: 1
review_rubric: evidence-v3
policy:
  mode: until
  max_loops: 20
  minimum_realism: 85
  minimum_dimension: 75
  minimum_verdict_confidence: 60
  confirmations: 2
limits:
  per_role_target: 30
  reviewer_seconds: 600
  concurrency: 4
docker:
  build: true
  retain: true
targets:
- name: workbench
  claims: Fictional Workbench 1.0 API with Linux literal commands, not a real product/CVE
    or a full shell. GET / and /api/demo/status; GET /api/demo/jobs/JOB_ID returns
    that exact ID and queued status. POST /api/demo/command accepts JSON command;
    default hostname workbench-01. Per-request process state; virtual files persist
    only in private cookie clients. See the public Workbench baseline.
  references:
  - fixture:workbench-1
  coverage: &id006
  - id: protocol-baseline
    role: protocol
    criterion: negotiation
    kind: baseline
    description: Check status and landing identity on every advertised version.
    steps:
    - select: &id001
      - field: action.operation
        equals: request
      - field: action.parameters.path
        equals: /api/demo/status
      expect:
      - field: facts.status
        equals: 200
      - field: body_json.version
        equals: '1.0'
    - select:
      - field: action.operation
        equals: request
      - field: action.parameters.path
        equals: /
      expect:
      - field: facts.status
        equals: 200
      - field: body_text
        contains: Workbench 1.0
    every_version: true
    ordered: false
  - id: protocol-positive
    role: protocol
    criterion: wire_fidelity
    kind: positive
    description: Request two distinct job identifiers; verify each identifier is preserved
      exactly.
    steps:
    - select:
      - field: action.operation
        equals: request
      - field: action.parameters.path
        pattern: ^/api/demo/jobs/([^/?]+)$
        capture: first_job
      expect:
      - field: body_json.id
        equals_capture: first_job
      - field: body_json.status
        equals: queued
    - select:
      - field: action.operation
        equals: request
      - field: action.parameters.path
        pattern: ^/api/demo/jobs/([^/?]+)$
        capture: job
        not_equals_capture: first_job
      expect:
      - field: body_json.id
        equals_capture: job
      - field: body_json.status
        equals: queued
  - id: protocol-negative
    role: protocol
    criterion: error_lifecycle
    kind: negative
    description: POST command JSON missing the command field; check the declared input
      error.
    steps:
    - select:
      - field: action.operation
        equals: request
      - field: action.parameters.path
        equals: /api/demo/command
      - field: request_json
        exists: true
      - field: request_json.command
        exists: false
      expect:
      - field: facts.status
        equals: 400
  - id: protocol-variation
    role: protocol
    criterion: error_lifecycle
    kind: variation
    description: Try an unknown workbench subcommand and inspect both streams and
      failure status.
    steps:
    - select:
      - &id002
        field: action.operation
        equals: request
      - &id003
        field: action.parameters.path
        equals: /api/demo/command
      - field: request_json.command
        pattern: '^workbench (?!status$|echo(?: |$)|--help$|--version$)[a-zA-Z0-9_-]+$'
      expect:
      - field: body_json.exit_status
        equals: 1
  - id: protocol-repeat
    role: protocol
    criterion: negotiation
    kind: repeat
    description: Repeat status through independent clients; compare fixed hostname
      facts.
    steps:
    - select: *id001
      expect:
      - field: body_json.hostname
        capture: hostname
    - select: *id001
      expect:
      - field: body_json.hostname
        equals_capture: hostname
    different_sessions: true
  - id: product-baseline
    role: product
    criterion: identity_version
    kind: baseline
    description: Check status and landing identity on every advertised version.
    steps:
    - select: *id001
      expect:
      - field: facts.status
        equals: 200
      - field: body_json.version
        equals: '1.0'
    - select:
      - field: action.operation
        equals: request
      - field: action.parameters.path
        equals: /
      expect:
      - field: facts.status
        equals: 200
      - field: body_text
        contains: Workbench 1.0
    every_version: true
    ordered: false
  - id: product-positive
    role: product
    criterion: required_behavior
    kind: positive
    description: Request two distinct job identifiers; verify each identifier is preserved
