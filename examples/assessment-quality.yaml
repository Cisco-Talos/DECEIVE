      - field: request_json
        exists: true
      - field: request_json.command
        exists: false
      expect:
      - field: facts.status
        equals: 400
  - id: product-variation
    role: product
    criterion: prerequisite_controls
    kind: variation
    description: Try an unknown workbench subcommand and inspect both streams and
      failure status.
    steps:
    - select:
      - *id002
      - *id003
      - field: request_json.command
        pattern: '^workbench (?!status$|echo(?: |$)|--help$|--version$)[a-zA-Z0-9_-]+$'
      expect:
      - field: body_json.exit_status
        equals: 1
  - id: product-repeat
    role: product
    criterion: identity_version
    kind: repeat
    description: Repeat status through independent clients; compare fixed hostname
      facts.
    steps:
    - select: *id001
      expect:
      - field: body_json.hostname
        capture: hostname
    - select: *id001
      expect:
      - field: body_json.hostname
        equals_capture: hostname
    different_sessions: true
  - id: attacker-baseline
    role: attacker
    criterion: task_prerequisites
    kind: baseline
    description: Check status and landing identity on every advertised version.
    steps:
    - select: *id001
      expect:
      - field: facts.status
        equals: 200
      - field: body_json.version
        equals: '1.0'
    - select:
      - field: action.operation
        equals: request
      - field: action.parameters.path
