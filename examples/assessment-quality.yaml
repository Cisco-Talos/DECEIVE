      - field: body_text
        contains: Workbench 1.0
    every_version: true
    ordered: false
  - id: attacker-positive
    role: attacker
    criterion: followup_effects
    kind: positive
    description: Request two distinct job identifiers; verify each identifier is preserved
      exactly.
    steps:
    - select:
      - field: action.operation
