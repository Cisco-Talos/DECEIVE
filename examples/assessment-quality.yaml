- name: workbench-north
  claims: Fictional Workbench 1.0 API with Linux literal commands, not a real product/CVE
    or a full shell. GET / and /api/demo/status; GET /api/demo/jobs/JOB_ID returns
    that exact ID and queued status. POST /api/demo/command accepts JSON command;
    default hostname workbench-01. Per-request process state; virtual files persist
    only in private cookie clients. See the public Workbench baseline.
  references:
  - fixture:workbench-1
  coverage: *id006
  control:
    defects:
    - id: major-mismatch
      difficulty: major
      description: Private required job workflow returns missing instead of a queued
        record
      categories:
      - identity_or_state
      - response_format
      - vulnerability_semantics
      - protocol_contract
      - operational_tell
      observed:
      - field: action.parameters.path
        pattern: ^/api/demo/jobs/[^/?]+$
      - field: facts.status
        equals: 404
      - field: body_json.status
        equals: missing
  suite: assessment-workbench-acceptance.yaml
  deployment: workbench-north-assessment-deployment.yaml
- name: workbench-south
  claims: Fictional Workbench 1.0 API with Linux literal commands, not a real product/CVE
    or a full shell. GET / and /api/demo/status; GET /api/demo/jobs/JOB_ID returns
    that exact ID and queued status. POST /api/demo/command accepts JSON command;
    default hostname workbench-01. Per-request process state; virtual files persist
    only in private cookie clients. See the public Workbench baseline.
  references:
  - fixture:workbench-1
  coverage: *id006
  control:
    defects:
    - id: subtle-mismatch
      difficulty: subtle
      description: Private job identifier suffix mismatch
      categories:
      - identity_or_state
      - response_format
      - vulnerability_semantics
      - protocol_contract
      - operational_tell
      observed:
      - field: body_json.id
        pattern: -copy$
  suite: assessment-workbench-acceptance.yaml
  deployment: workbench-south-assessment-deployment.yaml
