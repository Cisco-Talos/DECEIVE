schema_version: 1
# For version 2 organization/instance bindings, see contracts-deployment.yaml
# and ../docs/behavior-contracts.md.
# For two model-free reference CVEs, see reference-deployment.yaml.
# The sudo reference profile includes virtual /bin and /usr/bin listings and a
# bounded Python prompt; no container or host executables are invoked by SSH input.
# Add a selected provider to its SSH listener to allow unfamiliar commands and
# Python statements to use validated model proposals; model-free mode needs no keys.
# For CLI-only profile selection, use --provider-config providers.local.yaml to
# apply that catalog's global default without writing a second deployment YAML.
# For the model-free SSH auth-bypass profile, select sshhole-2026-123158 on its
# own SSH listener (or use: deceive serve --profile sshhole-2026-123158).
# Its profile-scoped ssh_auth policy overrides listener accounts only for that profile.
# Research-backed realism assessment is a separate workflow; see assessment-research.yaml.
# Workbench profile v2 has explicit read-only HEAD routes; POST commands stay explicit.
# For requirement-driven composition, see composition-deployment.yaml.
# Validate the exact selection before serving:
# deceive config validate --config deployment.yaml --deception ANOTHER_PROFILE
# Validation checks selected providers live by default; use --offline for CI/static checks.
# Managed deployment start preflights providers in-container before listeners open;
# --skip-preflight disables that gate for a new container, retaining static validation.
# CLI --deception / --profile selections add to this file; serve revalidates.
# Active assessment uses the separate assessment.yaml spec; production YAML is unchanged.
# Named Docker execution reuses this YAML: deceive deployment start NAME --config deployment.yaml.
# Install host agent skills with: deceive install-skills (defaults to both agents).
# Help is available through deceive help COMMAND, -h, or --help.
# See docs/operations.md: localhost publishing is the default, data_dir maps to a named
# volume, and managed file telemetry maps to /data/telemetry.jsonl. Native serve retains paths.
data_dir: ./data
sensor_name: deceive
# To share provider settings, copy providers.yaml to providers.local.yaml and add:
# provider_config: providers.local.yaml
# The catalog's default_provider applies where provider is omitted.
# Use provider: null on a listener (or default_provider: null here) to stay model-free.
# env_file: .env  # optional deployment override; paths belong to their owning YAML
# stdout JSONL is the default. Uncomment to write a file relative to this YAML.
# Rejected SSH model attempts and their delivered final failure share a request_id.
# Linux virtual commands include bounded literal-only printf and private bare history.
# log_file: ./logs/deceive.log
# Instead of explicit listeners, profiles can declare their own requirements:
# deceptions:
#   - profile: profiles/metrics.yaml
# deception_defaults:
#   host: 0.0.0.0
listeners:
  - name: web
    protocol: https
    profile: demo-http
    host: 0.0.0.0
    port: 8443
    quic_port: 8443
    versions: ["1.1", "2", "3"]
    # Set to the externally mapped UDP port when it differs from quic_port.
    advertised_port: 8443
# Add a named provider and an SSH listener to enable generative interaction.
# providers:
#   default:
#     kind: openai
#     model: YOUR_MODEL
#     api_key_env: OPENAI_API_KEY
#     temperature: null
# For Bedrock, replace that provider with these configurable settings:
# providers:
#   default:
#     kind: bedrock
#     aws_profile: YOUR_AWS_PROFILE
#     region: us-east-1
#     model: YOUR_MODEL_OR_INFERENCE_PROFILE_ID
#     max_output_tokens: 2048
#     temperature: null
# Omit aws_profile to use the default AWS credential chain (for example a task role).
# listeners:
#   - name: ssh
#     protocol: ssh
#     profile: linux-ssh
#     # linux-ssh v3 uses structured stdout/stderr/exit status and private virtual files; custom profiles
#     # select ssh_response_format: json in their own YAML (legacy default: text).
#     port: 8022
#     provider: default
#     analyze: true
#     accounts: {guest: "", root: "*", user1: secret}
# Whole-device model-free SSH: choose linux-device, macos-device, freebsd-device,
# or ios-device. They provide private channel state and platform-specific interpreters.
# IOS paging is inline (terminal length 0..512); Unix monitors share virtual resource
# facts with ps aux/model context. No host process or network inventory is read.
# Unix text-editor saves use LF line endings; pager scrolling and CPU counters
# retain their state across refresh/resize. IOS diagnostics identify caret/control keys.
# Provider request failures preserve SSH private state; sanitized attempt failures
# correlate with the final wire response. IOS connected routes track interface shutdown.
# Device packs declare terminal applications and optional validated model effects.
# Supported Unix command flags and application keys are listed in the device guide;
# assessment-only password continuation prompts belong to probe actions, not this YAML.
# See ../docs/device-sessions.md and testing.yaml for ignored local online configuration.
# limits:
#   channel_limit: 16
#   application_depth: 8
#   screen_columns: 240
#   screen_rows: 100
